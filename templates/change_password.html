<!DOCTYPE html>
<html>

<head>

<title>Change Password</title>

<link rel="stylesheet" href="/static/dashboard.css">

<style>

.box{
width:400px;
margin:100px auto;
background:#1e293b;
padding:30px;
border-radius:10px;
text-align:center;
}

input{
display:block;
margin:10px auto;
padding:10px;
width:250px;
}

button{
padding:10px 20px;
background:#22c55e;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

{% include "components/sidebar.html" %}

<div class="box">

<h2>Change Password</h2>

<form method="POST">

<input type="password" name="old_password" placeholder="Old Password" required>

<input type="password" name="new_password" placeholder="New Password" required>

<button type="submit">Update Password</button>

</form>

</div>

</body>
</html>
