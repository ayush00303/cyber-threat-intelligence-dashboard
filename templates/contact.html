<!DOCTYPE html>

<html>

<head>

<title>Contact</title>

<link rel="stylesheet" href="/static/dashboard.css">

<style>

body{
font-family:monospace;
background:#020617;
color:white;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* CARD */

.contact-box{
background:#1e293b;
padding:50px;
border-radius:12px;
width:420px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.6);
animation:fadein 0.8s ease;
}

.contact-box h1{
color:#38bdf8;
margin-bottom:25px;
}

/* LINKS */

.contact-link{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
margin:15px 0;
padding:12px;
border-radius:8px;
background:#020617;
border:1px solid #334155;
text-decoration:none;
color:#e2e8f0;
transition:0.3s;
}

.contact-link:hover{
background:#0f172a;
transform:scale(1.05);
}

/* ICON */

.icon{
font-size:20px;
}

/* FOOTER */

.footer{
margin-top:25px;
font-size:14px;
color:#94a3b8;
}

/* ANIMATION */

@keyframes fadein{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<div class="contact-box">

<h1>Contact Me</h1>

<a class="contact-link" href="mailto:ayushnandavade@gmail.com">

<span class="icon">📧</span> <span>[ayushnandavade@gmail.com](mailto:ayushnandavade@gmail.com)</span>

</a>

<a class="contact-link" href="https://instagram.com/https.aysh0.3" target="_blank">

<span class="icon">📷</span> <span>@https.aysh0.3</span>

</a>

<a class="contact-link" href="https://github.com/ayush00303" target="_blank">

<span class="icon">💻</span> <span>github.com/ayush00303</span>

</a>

<a class="contact-link" href="https://www.linkedin.com/in/ayush-nandavade-8b6a9a333/" target="_blank">

<span class="icon">🔗</span> <span>LinkedIn Profile</span>

</a>

<div class="footer">

Cyber Threat Intelligence Project

</div>

</div>

</body>

</html>
