<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link rel="stylesheet" href="/static/style.css">

<style>

/* CYBER GRID BACKGROUND */

body{

margin:0;
font-family:Arial;
color:white;

background-image:
linear-gradient(#1e293b 1px, transparent 1px),
linear-gradient(90deg,#1e293b 1px, transparent 1px);

background-size:40px 40px;

animation:gridmove 12s linear infinite;

}

/* GRID ANIMATION */

@keyframes gridmove{

0%{
background-position:0 0;
}

100%{
background-position:40px 40px;
}

}

/* LOGIN BOX */

.login-box{

width:320px;
margin:120px auto;
background:#1e293b;
padding:30px;
border-radius:10px;
text-align:center;

box-shadow:0 0 20px rgba(0,0,0,0.5);

}

.login-box h2{
color:#38bdf8;
margin-bottom:20px;
}

input{

display:block;
margin:10px auto;
padding:10px;
width:250px;
border:none;
border-radius:5px;

}

button{

padding:10px 20px;
background:#38bdf8;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
transition:0.3s;

}

button:hover{

background:#0ea5e9;
transform:scale(1.05);

}

a{

color:#38bdf8;
text-decoration:none;

}

a:hover{

text-decoration:underline;

}

</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form method="POST">

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<br>

<a href="/register">Create new account</a>

</div>

</body>

</html>
