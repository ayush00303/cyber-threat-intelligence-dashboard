<!DOCTYPE html>

<html>

<head>

<title>URL Scan Result</title>

<link rel="stylesheet" href="/static/style.css">

<style>

body{
background:#020617;
color:#e2e8f0;
font-family:monospace;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* RESULT CARD */

.result-box{
background:#1e293b;
padding:40px;
border-radius:12px;
width:480px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.6);
animation:fadein 0.8s ease;
}

.result-box h2{
color:#38bdf8;
margin-bottom:20px;
}

/* RESULT STATS */

.stats{
margin-top:20px;
}

.stat{
padding:12px;
margin:10px 0;
border-radius:8px;
font-size:16px;
}

/* COLORS */

.safe{
background:#00cc66;
}

.malicious{
background:#ff4d4d;
}

.suspicious{
background:#ff9900;
}

/* BUTTON */

.back-btn{
margin-top:20px;
display:inline-block;
padding:10px 18px;
background:#22c55e;
color:white;
text-decoration:none;
border-radius:6px;
transition:0.3s;
}

.back-btn:hover{
background:#16a34a;
transform:scale(1.05);
}

/* ANIMATION */

@keyframes fadein{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<div class="result-box">

<h2>URL Scan Result</h2>

<p><strong>URL:</strong></p>
<p style="color:#38bdf8">{{ result.url }}</p>

<div class="stats">

<div class="stat malicious">
🚨 Malicious Engines : {{ result.malicious }}
</div>

<div class="stat suspicious">
⚠️ Suspicious Engines : {{ result.suspicious }}
</div>

<div class="stat safe">
✅ Safe Engines : {{ result.harmless }}
</div>

</div>

<a href="/url-scan" class="back-btn">
Scan Another URL
</a>

</div>

</body>

</html>
