<!DOCTYPE html>

<html>

<head>

<title>VirusTotal URL Scanner</title>
<link rel="stylesheet" href="/static/style.css">

<style>

body{
background:#020617;
color:#e2e8f0;
font-family:monospace;
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

/* SCANNER CARD */

.scan-box{
background:#1e293b;
padding:40px;
border-radius:12px;
width:420px;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.6);
animation:fadein 0.8s ease;
}

.scan-box h2{
color:#38bdf8;
margin-bottom:20px;
}

/* INPUT */

.scan-box input{
width:90%;
padding:12px;
border:none;
border-radius:6px;
background:#020617;
color:white;
border:1px solid #334155;
margin-bottom:20px;
}

/* BUTTON */

.scan-box button{
padding:12px 22px;
border:none;
background:#22c55e;
color:white;
cursor:pointer;
border-radius:6px;
font-size:14px;
transition:0.3s;
}

.scan-box button:hover{
background:#16a34a;
transform:scale(1.05);
}

/* ANIMATION */

@keyframes fadein{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

</style>

</head>

<body>

<div class="scan-box">

<h2>VirusTotal URL Scanner</h2>

<form method="POST">

<input type="text" name="url" placeholder="Enter URL to scan" required>

<br>

<button type="submit">Scan URL</button>

</form>

</div>

</body>

</html>
